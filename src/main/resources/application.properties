# Database Configuration
# Fallback to H2 if no environment variables are provided (local dev)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Disable default Spring Security login page (we handle auth ourselves)
spring.security.user.name=admin
spring.security.user.password=admin123

# Serve static files
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.gymportal=INFO

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

# Actuator / Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Keep-Alive Configuration
# The URL of your application on Render (automatic) or a manual APP_URL
app.url=${RENDER_EXTERNAL_URL:${APP_URL:http://localhost:8080}}
